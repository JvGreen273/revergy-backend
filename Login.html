<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revergy Smart Projects - Acceso</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Heebo', sans-serif;
      background: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .login-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .logo {
      margin-bottom: 60px;
    }

    .logo img {
      height: 80px;
    }

    .login-form {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .input-field {
      width: 100%;
      padding: 14px 20px;
      font-size: 16px;
      font-family: 'Heebo', sans-serif;
      border: 2px solid #d0d0d0;
      border-radius: 8px;
      transition: border-color 0.3s;
    }

    .input-field:focus {
      outline: none;
      border-color: #7fa678;
    }

    .login-button {
      width: 100%;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 500;
      font-family: 'Heebo', sans-serif;
      background-color: #7fa678;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-top: 10px;
    }

    .login-button:hover {
      background-color: #6b9364;
    }

    .error-message {
      color: #d32f2f;
      font-size: 14px;
      text-align: center;
      margin-top: -10px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .footer-gradient {
      width: 100%;
      height: 250px;
      background-image: url('Fondos_Nueva_Imagen.jpg');
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: auto;
    }

    .footer-text {
      color: white;
      font-size: 18px;
      font-weight: 400;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    @media (max-width: 600px) {
      .logo img {
        height: 60px;
      }
      
      .footer-gradient {
        height: 180px;
      }
      
      .footer-text {
        font-size: 16px;
        padding: 0 20px;
      }
    }
  </style>
</head>

<body>

<div class="login-container">
  <div class="logo">
    <img src="7-revergy_horizontal.png" alt="Revergy">
  </div>

  <!-- Tabs login / registro -->
  <div style="display:flex;gap:24px;margin-bottom:28px;border-bottom:1px solid #e0e0e0;width:100%;max-width:400px;">
    <button id="btnLogin" onclick="cambiarModo('login')" style="background:none;border:none;border-bottom:2px solid #7fa678;padding:8px 0;font-family:'Heebo',sans-serif;font-size:15px;font-weight:600;color:#3c3c3b;cursor:pointer;">Iniciar sesión</button>
    <button id="btnRegistro" onclick="cambiarModo('registro')" style="background:none;border:none;border-bottom:none;padding:8px 0;font-family:'Heebo',sans-serif;font-size:15px;font-weight:400;color:#888;cursor:pointer;">Registrarse</button>
  </div>

  <form class="login-form" onsubmit="handleLogin(event)">

    <!-- Campos extra solo visibles en registro -->
    <div id="camposCodigo" style="display:none;flex-direction:column;gap:20px;">
      <input type="text" id="nombre" class="input-field" placeholder="Nombre completo" autocomplete="off"/>
      <select id="rolSelect" class="input-field" onchange="onRolChange()" style="color:#555;">
        <option value="user_enerland">Cliente Enerland</option>
        <option value="user_celsia">Cliente Celsia</option>
        <option value="user_edf">Cliente EDF</option>
        <option value="admin">Gerencia Revergy</option>
      </select>
      <div id="codigoWrap" style="display:none;">
        <input type="text" id="codigoAcceso" class="input-field" placeholder="Código de acceso" autocomplete="off"/>
      </div>
    </div>

    <input
      type="text"
      id="username"
      class="input-field"
      placeholder="Usuario"
      required
      autocomplete="username"
    />

    <input
      type="password"
      id="password"
      class="input-field"
      placeholder="Clave"
      required
      autocomplete="current-password"
    />

    <div class="error-message" id="errorMessage">
      Usuario o contraseña incorrectos
    </div>

    <button type="submit" id="submitBtn" class="login-button">Ingresar</button>
  </form>
</div>

<div class="footer-gradient">
  <div class="footer-text">Revergy Smart Projects – Copiloto de Proyectos</div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBkZOszYyvNicrAf9R3jlY4YlXODx8mdLo",
    authDomain: "revergy-chat.firebaseapp.com",
    databaseURL: "https://revergy-chat-default-rtdb.firebaseio.com",
    projectId: "revergy-chat",
    storageBucket: "revergy-chat.firebasestorage.app",
    messagingSenderId: "939186375864",
    appId: "1:939186375864:web:7ec6ecfcb3e848444ef84d"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // ─── MODO: login o registro ───
  let modoActual = 'login';

  window.cambiarModo = function(modo) {
    modoActual = modo;
    const btnLogin    = document.getElementById('btnLogin');
    const btnRegistro = document.getElementById('btnRegistro');
    const camposCodigo = document.getElementById('camposCodigo');
    const submitBtn   = document.getElementById('submitBtn');

    if (modo === 'login') {
      btnLogin.style.fontWeight    = '600';
      btnLogin.style.borderBottom  = '2px solid #7fa678';
      btnRegistro.style.fontWeight = '400';
      btnRegistro.style.borderBottom = 'none';
      camposCodigo.style.display   = 'none';
      submitBtn.textContent        = 'Ingresar';
    } else {
      btnRegistro.style.fontWeight  = '600';
      btnRegistro.style.borderBottom = '2px solid #7fa678';
      btnLogin.style.fontWeight     = '400';
      btnLogin.style.borderBottom   = 'none';
      camposCodigo.style.display    = 'flex';
      submitBtn.textContent         = 'Registrarse';
    }
    document.getElementById('errorMessage').classList.remove('show');
  };

  // ─── MOSTRAR/OCULTAR campo código según rol ───
  window.onRolChange = function() {
    const rol = document.getElementById('rolSelect').value;
    const codigoWrap = document.getElementById('codigoWrap');
    const codigoInput = document.getElementById('codigoAcceso');
    const placeholders = {
      admin:       'Código de acceso Gerencia',
      user_enerland: 'Código de acceso Enerland',
      user_celsia:   'Código de acceso Celsia',
      user_edf:      'Código de acceso EDF'
    };
    codigoWrap.style.display = 'block';
    codigoInput.placeholder = placeholders[rol] || 'Código de acceso';
  };

  // ─── SUBMIT principal ───
  window.handleLogin = async function(event) {
    event.preventDefault();
    const errorMessage = document.getElementById('errorMessage');
    errorMessage.classList.remove('show');

    const username = document.getElementById('username').value.trim().toLowerCase();
    const password = document.getElementById('password').value;

    if (modoActual === 'login') {
      // ── LOGIN ──
      try {
        const snap = await get(child(ref(db), `usuarios/${username}`));
        if (snap.exists()) {
          const userData = snap.val();
          if (userData.password === password) {
            localStorage.setItem('revergySession', JSON.stringify({
              username,
              role: userData.role,
              empresa: userData.empresa || 'revergy',
              proyectos: userData.proyectos || ['puerta_de_oro', 'pfv_venados'],
              name: userData.name,
              loginTime: new Date().toISOString()
            }));
            window.location.href = 'index.html';
          } else {
            mostrarError('Usuario o contraseña incorrectos');
          }
        } else {
          mostrarError('Usuario no encontrado');
        }
      } catch (e) {
        mostrarError('Error de conexión con la base de datos');
      }

    } else {
      // ── REGISTRO ──
      const nombre  = document.getElementById('nombre').value.trim();
      const rol     = document.getElementById('rolSelect').value;
      const codigo  = document.getElementById('codigoAcceso').value.trim();

      if (!nombre) return mostrarError('Ingresa tu nombre');

      // ─── Validar código según el perfil seleccionado ───
      const codigos = {
        admin:         'Revergy+',
        user_enerland: 'Enerland2026',
        user_celsia:   'Celsia2026',
        user_edf:      'EDF2026'
      };

      if (codigos[rol] && codigo !== codigos[rol]) {
        return mostrarError('Código de acceso incorrecto');
      }

      if (password.length < 6) {
        return mostrarError('La contraseña debe tener mínimo 6 caracteres');
      }

      // ─── Determinar empresa y proyectos según perfil ───
      let empresa = 'revergy';
      let proyectos = ['puerta_de_oro', 'pfv_venados', 'pv_melgar', 'solar_sur', 'eolico_este'];
      let roleGuardado = 'user';

      if (rol === 'admin') {
        roleGuardado = 'admin';
        empresa = 'revergy';
        proyectos = ['todos'];
      } else if (rol === 'user_enerland') {
        empresa = 'enerland';
        proyectos = ['pfv_venados'];
      } else if (rol === 'user_celsia') {
        empresa = 'celsia';
        proyectos = ['solar_sur', 'eolico_este'];
      } else if (rol === 'user_edf') {
        empresa = 'edf';
        proyectos = ['sdi_ii_construccion', 'sol_inirida_2'];
      }

      try {
        const snap = await get(child(ref(db), `usuarios/${username}`));
        if (snap.exists()) return mostrarError('Ese usuario ya existe');

        await set(ref(db, `usuarios/${username}`), {
          name: nombre,
          password: password,
          role: roleGuardado,
          empresa: empresa,
          proyectos: proyectos,
          creadoEn: new Date().toISOString()
        });

        // Login automático tras registro
        localStorage.setItem('revergySession', JSON.stringify({
          username,
          role: roleGuardado,
          empresa: empresa,
          proyectos: proyectos,
          name: nombre,
          loginTime: new Date().toISOString()
        }));
        window.location.href = 'index.html';

      } catch (e) {
        mostrarError('Error al registrar. Intenta de nuevo');
      }
    }
  };

  function mostrarError(msg) {
    const el = document.getElementById('errorMessage');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 3500);
  }

  // ─── Si ya hay sesión activa, ir directo al dashboard ───
  window.onload = function() {
    const session = localStorage.getItem('revergySession');
    if (session) window.location.href = 'index.html';
  };
</script>

</body>
</html>
